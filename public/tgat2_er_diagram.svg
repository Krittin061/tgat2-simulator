<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 900" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="entityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F86C6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="relationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <linearGradient id="attrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <linearGradient id="pkAttrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="jsonAttrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="725" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">🎯 TGAT2 Simulator - Database ER Diagram (Clean & Minimal)</text>
  <text x="725" y="75" text-anchor="middle" font-size="14" fill="#64748B">พิมพ์เขียวจำลองโครงสร้างฐานข้อมูล ฉบับตัดส่วนเกินและแก้ไขความสัมพันธ์ตรงกับโค้ด 100%</text>

  <!-- ==================== CONNECTING LINES (BEHIND SHAPES) ==================== -->
  <g stroke="#94A3B8" stroke-width="2">
    <!-- User to Attributes -->
    <line x1="280" y1="260" x2="135" y2="160" /> <!-- id -->
    <line x1="280" y1="260" x2="235" y2="140" /> <!-- name -->
    <line x1="280" y1="260" x2="335" y2="140" /> <!-- email -->
    <line x1="280" y1="260" x2="115" y2="250" /> <!-- password -->
    <line x1="280" y1="260" x2="135" y2="340" /> <!-- created_at -->

    <!-- User to Takes -->
    <line x1="375" y1="260" x2="560" y2="260" stroke="#0F172A" stroke-width="2.5" />
    <!-- Takes to ExamAttempt -->
    <line x1="660" y1="260" x2="845" y2="260" stroke="#0F172A" stroke-width="2.5" />

    <!-- ExamAttempt to Attributes -->
    <line x1="945" y1="260" x2="785" y2="140" /> <!-- id -->
    <line x1="945" y1="260" x2="875" y2="125" /> <!-- user_id -->
    <line x1="945" y1="260" x2="965" y2="120" /> <!-- user_name -->
    <line x1="945" y1="260" x2="1055" y2="125" /> <!-- mode -->
    <line x1="945" y1="260" x2="1155" y2="140" /> <!-- total_score -->
    <line x1="945" y1="260" x2="1205" y2="200" /> <!-- correct_count -->
    <line x1="945" y1="260" x2="1215" y2="260" /> <!-- total_questions -->
    <line x1="945" y1="260" x2="1205" y2="320" /> <!-- time_spent -->
    <line x1="945" y1="260" x2="1175" y2="380" /> <!-- skill_breakdown -->
    <line x1="945" y1="260" x2="1125" y2="435" /> <!-- answers -->
    <line x1="945" y1="260" x2="1055" y2="465" /> <!-- created_at -->

    <!-- ExamAttempt to Evaluates -->
    <line x1="945" y1="295" x2="945" y2="475" stroke="#0F172A" stroke-width="2.5" />
    <!-- Evaluates to Question -->
    <line x1="945" y1="555" x2="945" y2="705" stroke="#0F172A" stroke-width="2.5" />

    <!-- Question to Attributes -->
    <line x1="945" y1="740" x2="740" y2="670" /> <!-- id -->
    <line x1="945" y1="740" x2="725" y2="740" /> <!-- skill -->
    <line x1="945" y1="740" x2="735" y2="810" /> <!-- topic -->
    <line x1="945" y1="740" x2="820" y2="865" /> <!-- content -->
    <line x1="945" y1="740" x2="945" y2="875" /> <!-- choices -->
    <line x1="945" y1="740" x2="1070" y2="870" /> <!-- correct_answer -->
    <line x1="945" y1="740" x2="1165" y2="825" /> <!-- explanation -->
    <line x1="945" y1="740" x2="1175" y2="740" /> <!-- image -->
  </g>

  <!-- ==================== CARDINALITY LABELS ==================== -->
  <!-- User - Takes - ExamAttempt (Optional 0..1 to N) -->
  <text x="390" y="248" font-size="15" font-weight="bold" fill="#0F172A">0..1 (Guest)</text>
  <text x="820" y="248" font-size="15" font-weight="bold" fill="#0F172A">N</text>

  <!-- ExamAttempt - Evaluates - Question -->
  <text x="960" y="325" font-size="16" font-weight="bold" fill="#0F172A">N</text>
  <text x="960" y="695" font-size="16" font-weight="bold" fill="#0F172A">M</text>


  <!-- ==================== ENTITIES (RECTANGLES) ==================== -->
  <!-- Entity: User -->
  <g filter="url(#shadow)">
    <rect x="185" y="225" width="190" height="70" rx="8" fill="url(#entityGrad)" stroke="#1E40AF" stroke-width="2" />
    <text x="280" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">USERS</text>
    <text x="280" y="280" text-anchor="middle" font-size="12" fill="#DBEAFE">(ข้อมูลผู้ใช้งาน)</text>
  </g>

  <!-- Entity: ExamAttempt -->
  <g filter="url(#shadow)">
    <rect x="845" y="225" width="200" height="70" rx="8" fill="url(#entityGrad)" stroke="#1E40AF" stroke-width="2" />
    <text x="945" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EXAM_ATTEMPTS</text>
    <text x="945" y="280" text-anchor="middle" font-size="12" fill="#DBEAFE">(รอบการสอบ/ประวัติ)</text>
  </g>

  <!-- Entity: Question -->
  <g filter="url(#shadow)">
    <rect x="845" y="705" width="200" height="70" rx="8" fill="url(#entityGrad)" stroke="#1E40AF" stroke-width="2" />
    <text x="945" y="740" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">QUESTIONS</text>
    <text x="945" y="760" text-anchor="middle" font-size="12" fill="#DBEAFE">(คลังข้อสอบ 80 ข้อ)</text>
  </g>


  <!-- ==================== RELATIONSHIPS (DIAMONDS) ==================== -->
  <!-- Takes -->
  <g filter="url(#shadow)">
    <polygon points="610,215 660,260 610,305 560,260" fill="url(#relationGrad)" stroke="#991B1B" stroke-width="2" />
    <text x="610" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Takes</text>
    <text x="610" y="278" text-anchor="middle" font-size="11" fill="#FEE2E2">(เข้าทำสอบ)</text>
  </g>

  <!-- Evaluates / Contains -->
  <g filter="url(#shadow)">
    <polygon points="945,475 995,515 945,555 895,515" fill="url(#relationGrad)" stroke="#991B1B" stroke-width="2" />
    <text x="945" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Evaluates</text>
    <text x="945" y="530" text-anchor="middle" font-size="10" fill="#FEE2E2">(ตรวจ/ประเมินผล)</text>
  </g>


  <!-- ==================== ATTRIBUTES (ELLIPSES) ==================== -->
  
  <!-- --- USER ATTRIBUTES (No role) --- -->
  <!-- id (PK) -->
  <g filter="url(#shadow)">
    <ellipse cx="135" cy="160" rx="46" ry="22" fill="url(#pkAttrGrad)" stroke="#C2410C" stroke-width="2" />
    <text x="135" y="165" text-anchor="middle" font-size="13" font-weight="bold" text-decoration="underline" fill="#431407">id (PK)</text>
  </g>
  <!-- name -->
  <g filter="url(#shadow)">
    <ellipse cx="235" cy="140" rx="38" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="235" y="145" text-anchor="middle" font-size="12" fill="#713F12">name</text>
  </g>
  <!-- email -->
  <g filter="url(#shadow)">
    <ellipse cx="335" cy="140" rx="44" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="335" y="145" text-anchor="middle" font-size="12" fill="#713F12">email (UK)</text>
  </g>
  <!-- password -->
  <g filter="url(#shadow)">
    <ellipse cx="115" cy="250" rx="45" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="115" y="255" text-anchor="middle" font-size="12" fill="#713F12">password</text>
  </g>
  <!-- created_at -->
  <g filter="url(#shadow)">
    <ellipse cx="135" cy="340" rx="48" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="135" y="345" text-anchor="middle" font-size="12" fill="#713F12">created_at</text>
  </g>

  <!-- --- EXAM_ATTEMPT ATTRIBUTES (No max_score) --- -->
  <!-- id (PK) -->
  <g filter="url(#shadow)">
    <ellipse cx="785" cy="140" rx="44" ry="22" fill="url(#pkAttrGrad)" stroke="#C2410C" stroke-width="2" />
    <text x="785" y="145" text-anchor="middle" font-size="13" font-weight="bold" text-decoration="underline" fill="#431407">id (PK)</text>
  </g>
  <!-- user_id -->
  <g filter="url(#shadow)">
    <ellipse cx="875" cy="125" rx="45" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="875" y="130" text-anchor="middle" font-size="12" fill="#713F12">user_id</text>
  </g>
  <!-- user_name -->
  <g filter="url(#shadow)">
    <ellipse cx="965" cy="120" rx="46" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="965" y="125" text-anchor="middle" font-size="12" fill="#713F12">user_name</text>
  </g>
  <!-- mode -->
  <g filter="url(#shadow)">
    <ellipse cx="1055" cy="125" rx="40" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="1055" y="130" text-anchor="middle" font-size="12" fill="#713F12">mode</text>
  </g>
  <!-- total_score (Derived) -->
  <g filter="url(#shadow)">
    <ellipse cx="1155" cy="140" rx="55" ry="22" fill="url(#attrGrad)" stroke="#A16207" stroke-width="2" stroke-dasharray="4 3" />
    <text x="1155" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#713F12">total_score</text>
  </g>
  <!-- correct_count (Derived) -->
  <g filter="url(#shadow)">
    <ellipse cx="1205" cy="200" rx="55" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="2" stroke-dasharray="4 3" />
    <text x="1205" y="205" text-anchor="middle" font-size="12" fill="#713F12">correct_count</text>
  </g>
  <!-- total_questions -->
  <g filter="url(#shadow)">
    <ellipse cx="1215" cy="260" rx="58" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="1215" y="265" text-anchor="middle" font-size="12" fill="#713F12">total_questions</text>
  </g>
  <!-- time_spent -->
  <g filter="url(#shadow)">
    <ellipse cx="1205" cy="320" rx="52" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="1205" y="325" text-anchor="middle" font-size="12" fill="#713F12">time_spent</text>
  </g>
  <!-- skill_breakdown (JSONB) -->
  <g filter="url(#shadow)">
    <ellipse cx="1175" cy="380" rx="60" ry="22" fill="url(#jsonAttrGrad)" stroke="#7E22CE" stroke-width="1.5" />
    <text x="1175" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B0764">skill_breakdown</text>
  </g>
  <!-- answers (JSONB) -->
  <g filter="url(#shadow)">
    <ellipse cx="1125" cy="435" rx="50" ry="22" fill="url(#jsonAttrGrad)" stroke="#7E22CE" stroke-width="1.5" />
    <text x="1125" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#3B0764">answers</text>
  </g>
  <!-- created_at -->
  <g filter="url(#shadow)">
    <ellipse cx="1055" cy="465" rx="46" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="1055" y="470" text-anchor="middle" font-size="12" fill="#713F12">created_at</text>
  </g>

  <!-- --- QUESTION ATTRIBUTES (No skill_label) --- -->
  <!-- id (PK) -->
  <g filter="url(#shadow)">
    <ellipse cx="740" cy="670" rx="44" ry="22" fill="url(#pkAttrGrad)" stroke="#C2410C" stroke-width="2" />
    <text x="740" y="675" text-anchor="middle" font-size="13" font-weight="bold" text-decoration="underline" fill="#431407">id (PK)</text>
  </g>
  <!-- skill -->
  <g filter="url(#shadow)">
    <ellipse cx="725" cy="740" rx="40" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="725" y="745" text-anchor="middle" font-size="12" fill="#713F12">skill</text>
  </g>
  <!-- topic -->
  <g filter="url(#shadow)">
    <ellipse cx="735" cy="810" rx="42" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="735" y="815" text-anchor="middle" font-size="12" fill="#713F12">topic</text>
  </g>
  <!-- content -->
  <g filter="url(#shadow)">
    <ellipse cx="820" cy="865" rx="48" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="820" y="870" text-anchor="middle" font-size="12" fill="#713F12">content</text>
  </g>
  <!-- choices (JSONB) -->
  <g filter="url(#shadow)">
    <ellipse cx="945" cy="875" rx="52" ry="22" fill="url(#jsonAttrGrad)" stroke="#7E22CE" stroke-width="1.5" />
    <text x="945" y="880" text-anchor="middle" font-size="12" font-weight="bold" fill="#3B0764">choices (5)</text>
  </g>
  <!-- correct_answer -->
  <g filter="url(#shadow)">
    <ellipse cx="1070" cy="870" rx="55" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="1070" y="875" text-anchor="middle" font-size="12" fill="#713F12">correct_answer</text>
  </g>
  <!-- explanation (JSONB) -->
  <g filter="url(#shadow)">
    <ellipse cx="1165" cy="825" rx="58" ry="22" fill="url(#jsonAttrGrad)" stroke="#7E22CE" stroke-width="1.5" />
    <text x="1165" y="830" text-anchor="middle" font-size="12" font-weight="bold" fill="#3B0764">explanation</text>
  </g>
  <!-- image -->
  <g filter="url(#shadow)">
    <ellipse cx="1175" cy="740" rx="48" ry="20" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" />
    <text x="1175" y="745" text-anchor="middle" font-size="12" fill="#713F12">image (CDN)</text>
  </g>


  <!-- ==================== LEGEND / คำอธิบายสัญลักษณ์ ==================== -->
  <g transform="translate(240, 500)" filter="url(#shadow)">
    <rect width="280" height="260" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="140" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">คำอธิบายสัญลักษณ์ (Legend)</text>
    <line x1="20" y1="38" x2="260" y2="38" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Entity -->
    <rect x="25" y="52" width="38" height="22" rx="4" fill="url(#entityGrad)" stroke="#1E40AF" stroke-width="1" />
    <text x="75" y="68" font-size="13" fill="#334155">Entity (สิ่งที่จัดเก็บข้อมูลจริง)</text>

    <!-- Relationship -->
    <polygon points="44,86 54,98 44,110 34,98" fill="url(#relationGrad)" stroke="#991B1B" stroke-width="1" />
    <text x="75" y="102" font-size="13" fill="#334155">Relationship (ความสัมพันธ์)</text>

    <!-- Attribute -->
    <ellipse cx="44" cy="132" rx="20" ry="11" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1" />
    <text x="75" y="136" font-size="13" fill="#334155">Attribute (คุณสมบัติทั่วไป)</text>

    <!-- Primary Key -->
    <ellipse cx="44" cy="165" rx="20" ry="11" fill="url(#pkAttrGrad)" stroke="#C2410C" stroke-width="1.5" />
    <text x="75" y="169" font-size="13" text-decoration="underline" font-weight="bold" fill="#334155"><u>Key</u> (Primary Key)</text>

    <!-- Derived Attribute -->
    <ellipse cx="44" cy="198" rx="20" ry="11" fill="url(#attrGrad)" stroke="#A16207" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="75" y="202" font-size="13" fill="#334155">Derived (คำนวณอัตโนมัติ)</text>

    <!-- JSONB Attribute -->
    <ellipse cx="44" cy="231" rx="20" ry="11" fill="url(#jsonAttrGrad)" stroke="#7E22CE" stroke-width="1.5" />
    <text x="75" y="235" font-size="13" font-weight="bold" fill="#3B0764">JSONB (โครงสร้าง Object)</text>
  </g>
</svg>
